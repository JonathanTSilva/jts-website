version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "katex"
        versions: [">=0.17.0"]   # rehype-katex still emits 0.16 markup
      - dependency-name: "typescript"
        versions: [">=7.0.0"]   # @astrojs/check does not support TS 7 yet
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    groups:
      devcontainers:
        patterns: ["*"]
    commit-message:
      prefix: chore(deps)
