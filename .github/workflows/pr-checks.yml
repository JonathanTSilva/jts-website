name: PR checks

# Checks that only this repo can run and that the shared `ci` workflow does not:
# the CV PDF checks (need poppler), an offline internal link check of the built
# site, the WebKit smoke test and the Lighthouse budgets. Everything else runs in `ci`.
on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unique-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_API_HOST: ${{ vars.PUBLIC_PLAUSIBLE_API_HOST }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same install as pipeline.yml (issue #154): OS packages with a time limit
      # and mirror fallback per apt attempt, then the browsers.
      - name: Install system packages (Playwright deps, Poppler)
        timeout-minutes: 12
        run: scripts/install-ci-system-deps.sh poppler-utils
        env:
          APT_ATTEMPT_SECONDS: '3'  # TEMPORARY: force the retry path, reverted next commit

      # Chromium renders the CV PDF during the build; WebKit runs the smoke test.
      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm exec playwright install chromium webkit

      - name: Build
        run: pnpm build

      - name: Check CV with Poppler
        run: pnpm cv:check:poppler

      - name: Check CV deploy boundary
        run: pnpm cv:check:dist

      # The test fixtures are built into dist/test-fixtures here (the deploy removes them).
      # /pt-br/404 is excluded: no such file exists, but GitHub Pages serves 404.html for it
      # and its script shows Portuguese for /pt-br paths, so the switcher link works.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist --exclude /pt-br/404 dist
          fail: true

      - name: WebKit smoke test
        run: pnpm exec playwright test --project=webkit-mobile
        env:
          PLAYWRIGHT_WEBKIT: '1'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Lighthouse score and Core Web Vitals budgets (lighthouserc.budgets.json): median of
  # 3 runs per page, for / and /pt-br/. The `lighthouse` job in `ci` only audits and
  # asserts nothing. The CV PDF step is skipped: it needs Playwright browsers and
  # the audit does not need the PDF.
  lighthouse-budgets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build:search && pnpm exec astro build

      - name: Lighthouse budgets
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.budgets.json
          runs: 3
          uploadArtifacts: true
          temporaryPublicStorage: false
