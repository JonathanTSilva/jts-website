name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  hygiene:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: JonathanTSilva/.github/.github/workflows/pr-hygiene.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4

  docs:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/lint-docs.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4

  security:
    # GitHub checks caller permissions statically, so all of them are granted
    # even when the job is skipped or runs with public: false.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      security-events: write
    uses: JonathanTSilva/.github/.github/workflows/security.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    with:
      public: true

  node:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/node.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    with:
      coverage: true

  # Sends the lcov file from the node job to Codecov. Never fails CI.
  coverage:
    needs: node
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: JonathanTSilva/.github/.github/workflows/coverage.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    with:
      artifact: node-coverage
      flags: node

  # The site's own Playwright suite. The shared workflow pins ubuntu-24.04.
  e2e:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/e2e.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    with:
      command: pnpm build && pnpm exec playwright test

  # Lighthouse CI against the built site. The CV PDF step is skipped because it
  # needs Playwright browsers; the audit does not need the PDF.
  lighthouse:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/lighthouse.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    with:
      build-command: pnpm build:search && pnpm exec astro build
      static-dist-dir: dist

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      attestations: write
    uses: JonathanTSilva/.github/.github/workflows/release.yml@41e78aaeff1979651002c8d5ea6ca3843670afe7 # v1.2.4
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  # The one check the repository ruleset requires. Skipped jobs are fine.
  ci:
    name: ci
    if: always()
    needs:
      - hygiene
      - docs
      - security
      - node
      - coverage
      - e2e
      - lighthouse
      - release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
