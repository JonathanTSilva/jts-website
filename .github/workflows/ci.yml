name: ci

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions: {}

jobs:
  hygiene:
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    uses: JonathanTSilva/.github/.github/workflows/pr-hygiene.yml@v1

  docs:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/lint-docs.yml@v1

  security:
    # GitHub checks caller permissions statically, so all of them are granted
    # even when the job is skipped or runs with public: false.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
      security-events: write
    uses: JonathanTSilva/.github/.github/workflows/security.yml@v1
    with:
      public: true

  node:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/node.yml@v1
    with:
      coverage: true

  # Sends the lcov file from the node job to Codecov. Never fails CI.
  coverage:
    needs: node
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: JonathanTSilva/.github/.github/workflows/coverage.yml@v1
    with:
      artifact: node-coverage
      flags: node

  # The site's own Playwright suite. pipeline.yml already runs it on ubuntu-24.04.
  # Switched off because the shared e2e workflow runs on ubuntu-latest, which is
  # 26.04 and not yet supported by Playwright ("playwright install" fails there).
  # Remove the `if` once the shared workflow pins a supported runner.
  e2e:
    if: false
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/e2e.yml@v1
    with:
      command: pnpm build && pnpm exec playwright test

  # Lighthouse CI against the built site. The CV PDF step is skipped because it
  # needs Playwright browsers; the audit does not need the PDF.
  lighthouse:
    permissions:
      contents: read
    uses: JonathanTSilva/.github/.github/workflows/lighthouse.yml@v1
    with:
      build-command: pnpm build:search && pnpm exec astro build
      static-dist-dir: dist

  # The one check the repository ruleset requires. Skipped jobs are fine.
  ci:
    name: ci
    if: always()
    needs:
      - hygiene
      - docs
      - security
      - node
      - coverage
      - e2e
      - lighthouse
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail if any job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
