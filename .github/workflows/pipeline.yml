name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly rebuild so /engineering picks up fresh jts-ops dashboard data
    - cron: '17 4 * * *'

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_API_HOST: ${{ vars.PUBLIC_PLAUSIBLE_API_HOST }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
          
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright Browsers
        run: pnpm test:e2e:install

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
        
      - name: Check Astro
        run: pnpm check
        
      - name: Lint Content
        run: pnpm lint:content
        
      - name: Unit Tests
        run: pnpm test:unit
        
      - name: Build
        run: pnpm build

      - name: Check CV with Poppler
        run: pnpm cv:check:poppler

      - name: Check CV deploy boundary
        run: pnpm cv:check:dist

      - name: E2E Tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_WEBKIT: '1'

      # The E2E fixtures (tests/fixtures/content) are built under /test-fixtures/ so the
      # E2E suite can run against content this repo owns. They must never be published.
      - name: Remove test fixtures from the deploy
        run: rm -rf dist/test-fixtures dist/pt-br/test-fixtures

      - name: Fail if test fixtures would be deployed
        run: |
          leaks="$(grep -rl "test-fixtures" dist --include=*.html --include=*.xml --include=*.json || true)"
          if [ -n "$leaks" ] || [ -e dist/test-fixtures ] || [ -e dist/pt-br/test-fixtures ]; then
            echo "::error::Test fixtures would be deployed. Remove the route or reference below from the build output."
            if [ -n "$leaks" ]; then
              echo "Files that mention test-fixtures:"
              echo "$leaks"
            fi
            ls -d dist/test-fixtures dist/pt-br/test-fixtures 2>/dev/null || true
            exit 1
          fi
          echo "No test fixtures in dist."

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
