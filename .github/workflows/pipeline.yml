name: Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Nightly rebuild so /engineering picks up fresh jts-ops dashboard data
    - cron: '17 4 * * *'

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_API_HOST: ${{ vars.PUBLIC_PLAUSIBLE_API_HOST }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
          
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright Browsers
        run: pnpm test:e2e:install

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
        
      - name: Check Astro
        run: pnpm check
        
      - name: Lint Content
        run: pnpm lint:content
        
      - name: Unit Tests
        run: pnpm test:unit
        
      - name: Build
        run: pnpm build

      - name: Check CV with Poppler
        run: pnpm cv:check:poppler

      - name: Check CV deploy boundary
        run: pnpm cv:check:dist

      - name: E2E Tests
        run: pnpm test:e2e
        
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: ./dist

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
