name: Pipeline

on:
  push:
    branches: [ main ]
  schedule:
    # Nightly rebuild so /engineering picks up fresh jts-ops dashboard data
    - cron: '17 4 * * *'
  # Manual run. Only a run on main deploys; the shared `ci` workflow and
  # pr-checks.yml cover pull requests.
  workflow_dispatch:

# Serialize runs per ref and never cancel: a main deploy must not be cut off mid-run.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    # A normal run takes 4-5 minutes. Without a limit a hung step (a stalled browser
    # download, for example) holds this run and every queued deploy for 6 hours.
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
      PUBLIC_PLAUSIBLE_API_HOST: ${{ vars.PUBLIC_PLAUSIBLE_API_HOST }}
      PUBLIC_PLAUSIBLE_SCRIPT_SRC: ${{ vars.PUBLIC_PLAUSIBLE_SCRIPT_SRC }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json
          
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        
      - name: Install Playwright Browsers
        run: pnpm test:e2e:install

      - name: Install Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
        
      - name: Check Astro
        run: pnpm check
        
      - name: Lint Content
        run: pnpm lint:content
        
      - name: Unit Tests
        run: pnpm test:unit
        
      - name: Build
        run: pnpm build

      - name: Check CV with Poppler
        run: pnpm cv:check:poppler

      - name: Check CV deploy boundary
        run: pnpm cv:check:dist

      - name: E2E Tests
        run: pnpm test:e2e
        env:
          PLAYWRIGHT_WEBKIT: '1'

      # The E2E fixtures (tests/fixtures/content) are built under /test-fixtures/ so the
      # E2E suite can run against content this repo owns. They must never be published.
      - name: Remove test fixtures from the deploy
        run: rm -rf dist/test-fixtures dist/pt-br/test-fixtures

      - name: Fail if test fixtures would be deployed
        run: |
          leaks="$(grep -rl "test-fixtures" dist --include=*.html --include=*.xml --include=*.json || true)"
          if [ -n "$leaks" ] || [ -e dist/test-fixtures ] || [ -e dist/pt-br/test-fixtures ]; then
            echo "::error::Test fixtures would be deployed. Remove the route or reference below from the build output."
            if [ -n "$leaks" ]; then
              echo "Files that mention test-fixtures:"
              echo "$leaks"
            fi
            ls -d dist/test-fixtures dist/pt-br/test-fixtures 2>/dev/null || true
            exit 1
          fi
          echo "No test fixtures in dist."

      # Offline check of every internal link in the built site. Root-relative links
      # resolve against dist/ (directory index.html and extension-less links work).
      # /pt-br/404 is excluded: no such file exists, but GitHub Pages serves 404.html for it
      # and its script shows Portuguese for /pt-br paths, so the switcher link works.
      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/dist --exclude /pt-br/404 dist
          fail: true

      # upload-pages-artifact drops dotfiles by default; /.well-known/security.txt
      # lives in a dot directory, so hidden files must be included.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist
          include-hidden-files: true

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One Pages deployment at a time, never cancelled (GitHub's recommended setup).
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
