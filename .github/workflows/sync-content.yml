name: Sync Content

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ sync_content ]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout website repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          token: ${{ secrets.OBSIDIAN_SYNC_TOKEN }}
          path: website-repo

      - name: Checkout private content repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: JonathanTSilva/jts-brain
          token: ${{ secrets.OBSIDIAN_SYNC_TOKEN }}
          path: content-repo

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 10
          
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: website-repo/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: website-repo
        run: pnpm install --frozen-lockfile

      - name: Sync Content
        working-directory: website-repo
        env:
          SYNC_SOURCE_DIR: ${{ github.workspace }}/content-repo
        run: pnpm sync:content

      - name: Validate Content
        working-directory: website-repo
        run: pnpm lint:content

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6.1.0
        with:
          path: website-repo
          token: ${{ secrets.OBSIDIAN_SYNC_TOKEN }}
          commit-message: "chore: sync content from vault"
          title: "chore: sync content from vault"
          body: "This PR was automatically created to sync content from the private vault."
          branch: "sync/content"
          delete-branch: true
