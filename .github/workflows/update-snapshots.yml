name: Update Visual Snapshots

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to update snapshots on'
        required: false
        default: ''

permissions: {}

jobs:
  update-snapshots:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.branch || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Same install as pipeline.yml (issue #154), without Poppler.
      - name: Install system packages (Playwright deps)
        timeout-minutes: 12
        run: scripts/install-ci-system-deps.sh

      - name: Install Playwright browsers
        timeout-minutes: 5
        run: pnpm exec playwright install chromium webkit

      - name: Build
        run: pnpm build

      - name: Update snapshots
        run: pnpm test:e2e:update

      - name: Commit updated snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/visual.spec.ts-snapshots/ tests/e2e/cv.spec.ts-snapshots/
          git diff --staged --quiet || git commit -m "test(visual): update snapshots"
          git push
