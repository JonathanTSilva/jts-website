config:
  MD013: false  # prose is one line per paragraph
  MD060: false  # table pipe spacing
  MD041: false  # CLAUDE.md starts with an import, not a heading
  MD024:
    siblings_only: true  # repeated headings under different parents are fine
# Legacy prose and site content predate the standard. Content is written in
# Obsidian and synced in, so it is not reformatted to fit the lint rules.
ignores:
  - "src/content/**"
  - "docs/**"
  - "GEMINI.md"
  - ".github/agents/**"
  - ".worktrees/**"
  - "node_modules/**"
